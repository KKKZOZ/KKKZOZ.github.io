# Builds the example site with the newest Tola release, and with Tola's main
# branch as an early warning. The weekly run catches new Tola releases even
# when the theme itself has not changed.
name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Latest Tola release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Pagefind
        run: npm ci

      - name: Install the latest Tola release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo tola-rs/tola-ssg --json tagName --jq .tagName)
          archive="tola-${tag#v}-x86_64-unknown-linux-musl.tar.gz"
          gh release download "$tag" --repo tola-rs/tola-ssg --pattern "$archive" --pattern checksums.txt --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          grep " $archive\$" checksums.txt | sha256sum --check -
          mkdir -p "$HOME/.local/bin"
          tar xzf "$archive" -C "$HOME/.local/bin" tola
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: tola --version

      - name: Build
        run: tola build

  main:
    name: Tola main
    runs-on: ubuntu-latest
    # Upstream main may break between releases; report it without failing
    # the workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Pagefind
        run: npm ci

      - name: Resolve Tola main
        id: tola
        run: echo "sha=$(git ls-remote https://github.com/tola-rs/tola-ssg.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore Tola build
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tola
          key: tola-main-${{ steps.tola.outputs.sha }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tola from main
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/tola-rs/tola-ssg.git --rev ${{ steps.tola.outputs.sha }} tola

      - run: tola --version

      - name: Build
        run: tola build
