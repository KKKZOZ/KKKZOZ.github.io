# Builds the example site with every Tola release the theme supports (the
# compatibility matrix), and with Tola's main branch as an early warning. The
# weekly run catches new Tola releases even when the theme itself has not
# changed: each one joins the matrix on its own.
name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Oldest supported Tola release; keep it in step with the README badges.
  MIN_TOLA: 0.8.0

jobs:
  versions:
    name: Supported Tola releases
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      # Stable releases from MIN_TOLA on, newest first, as a JSON array.
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=$(
            gh release list --repo tola-rs/tola-ssg --exclude-pre-releases --exclude-drafts --limit 100 --json tagName --jq '.[].tagName' \
              | sed 's/^v//' \
              | while read -r v; do
                  [ "$(printf '%s\n%s\n' "$MIN_TOLA" "$v" | sort -V | head -n1)" = "$MIN_TOLA" ] && echo "$v"
                done \
              | sort -rV \
              | jq -R -s -c 'split("\n") | map(select(. != ""))'
          )
          echo "Supported releases: $versions"
          [ "$versions" != "[]" ]
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  release:
    name: Tola ${{ matrix.version }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      # Report every release, not only the first one that breaks.
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Pagefind
        run: npm ci

      - uses: ./.github/actions/install-tola
        with:
          version: ${{ matrix.version }}

      - name: Build
        run: tola build

  main:
    name: Tola main
    runs-on: ubuntu-latest
    # Upstream main may break between releases; report it without failing
    # the workflow.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Pagefind
        run: npm ci

      - name: Resolve Tola main
        id: tola
        run: echo "sha=$(git ls-remote https://github.com/tola-rs/tola-ssg.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore Tola build
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tola
          key: tola-main-${{ steps.tola.outputs.sha }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tola from main
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/tola-rs/tola-ssg.git --rev ${{ steps.tola.outputs.sha }} tola

      - run: tola --version

      - name: Build
        run: tola build
