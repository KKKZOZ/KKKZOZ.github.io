# Builds the blog and publishes it to GitHub Pages on every push.
#
# The repository needs Settings → Pages → Source set to "GitHub Actions", and
# the branch below allowed by the `github-pages` environment's deployment
# branch rules. The custom domain is set in the Pages settings; the address
# feeds and sitemaps use is `origin` in tola.toml.
#
# Tola fetches everything else itself, pinned by tola.lock: the NASApunk
# theme, Sarasa Gothic SC (the `cjk` font module) and, on the first build,
# Pagefind for the search index.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Bump together with the local Tola (mise.toml).
  TOLA_VERSION: 0.8.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Tola
        uses: ./.github/actions/install-tola
        with:
          version: ${{ env.TOLA_VERSION }}

      # The theme, font module, Typst packages and Pagefind, between runs.
      - uses: actions/cache@v4
        with:
          path: .tola
          key: tola-${{ env.TOLA_VERSION }}-${{ hashFiles('tola.lock') }}
          restore-keys: tola-${{ env.TOLA_VERSION }}-

      - name: Build
        run: tola build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
