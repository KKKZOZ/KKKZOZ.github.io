# Builds the blog and publishes it to GitHub Pages on every push.
#
# The repository needs Settings → Pages → Source set to "GitHub Actions", and
# the branch below allowed by the `github-pages` environment's deployment
# branch rules. The custom domain is set in the Pages settings; the address
# feeds and sitemaps use is `origin` in tola.toml.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Bump together with the local Tola (mise).
  TOLA_VERSION: 0.8.1
  # CJK font for SVG frames (math, cetz) and the preview image (`cjk-font` in
  # templates/config.typ); IBM Plex Mono and Rajdhani ship in typst-fonts/.
  SARASA_VERSION: 1.0.43

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The runner context is not available in job-level env.
      - run: echo "FONT_DIR=$RUNNER_TEMP/fonts" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Pagefind
        run: npm ci

      - name: Install Tola
        uses: ./.github/actions/install-tola
        with:
          version: ${{ env.TOLA_VERSION }}

      - name: Restore fonts
        id: fonts
        uses: actions/cache@v4
        with:
          path: ${{ env.FONT_DIR }}
          key: fonts-sarasa-${{ env.SARASA_VERSION }}-v1

      # Sarasa Gothic SC from its release, only the styles the theme uses.
      - name: Download fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$FONT_DIR"
          archive="SarasaGothicSC-TTF-Unhinted-$SARASA_VERSION.7z"
          gh release download "v$SARASA_VERSION" --repo be5invis/Sarasa-Gothic --pattern "$archive" --dir "$RUNNER_TEMP"
          7z e -y -o"$FONT_DIR" "$RUNNER_TEMP/$archive" \
            SarasaGothicSC-Regular.ttf SarasaGothicSC-Italic.ttf SarasaGothicSC-SemiBold.ttf \
            SarasaGothicSC-Bold.ttf SarasaGothicSC-BoldItalic.ttf
          ls -l "$FONT_DIR"

      - name: Build
        run: tola build --font-path "$FONT_DIR"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
