[tasks."theme:update"]
description = "Upgrade the NASApunk theme to its latest commit and record it in tola.lock"
run = "tola update nasapunk"

[tasks.publish]
description = "Stage everything, commit as \"YYYY-MM-DD update\", and push"
shell = "bash -c"
run = '''
set -euo pipefail
git add --all
if git diff --cached --quiet; then
  echo "Nothing to commit."
else
  git commit -m "$(date +%F) update"
fi
git push
'''

[tools]
tola = "0.8.2"
