# Tola configuration (v0.8.2)
# https://github.com/tola-rs/tola-ssg
#
# The theme is the NASApunk module, fetched from Git (`tola update nasapunk`
# upgrades it and records the commit in tola.lock). Its options go under
# [modules.nasapunk.options]; every option, with its default and notes, is in
# https://github.com/KKKZOZ/tola-theme-nasapunk/blob/main/theme/tola-module.toml

# tola help "[site]"
[site]
origin = "https://blog.kkkzoz.top"  # Public address; needed for feeds and sitemaps
base-path = "/"
title = "KKKZOZ's Blog"
authors = [{ name = "kkkzoz" }]
description = "Technical notes, mostly on LLM inference."
language = "en"

# tola help "[build]"
# site.typ calls the theme's `render-site` with the Typst-valued settings:
# analytics, the blog's stylesheet and giscus comments.
[build]
entry = "site.typ"
content-dir = "content"
publish-dir = "public"

# tola help "[build.references]"
# A broken link, image or section anchor fails the build. Links to drafts
# are not links until the draft publishes.
[build.references]
navigation = "error"
resources = "error"
fragments = "error"

# tola help "[modules]"
[modules.nasapunk]
git = { url = "https://github.com/KKKZOZ/tola-theme-nasapunk", subdir = "theme" }

[modules.nasapunk.options]
doc-prefix = "KKZ-TN"
cjk-font = "Sarasa Gothic SC"
# About half the posts are in Chinese: index the whole site as Chinese.
search-language = "zh"
math-check = true
social-links = [
  { label = "GitHub", url = "https://github.com/KKKZOZ" },
]

# Blog figures only (figures/ktransformers.typ, figures/ml-compiler.typ,
# figures/cpu-gemv-bandwidth.typ).
[modules.nasapunk.options.colors]
blue-mid = ["#d2e2e7", "#24363d"]
sand = ["#f5e6cb", "#3d3220"]

# Sarasa Gothic SC for CJK text in figures and preview images, as a font
# module, so every build machine (CI included) draws the same glyphs.
[modules.cjk]
tarball = { url = "https://github.com/KKKZOZ/tola-theme-nasapunk/releases/download/sarasa-1.0.43/nasapunk-cjk.tar.gz" }

# tola help "[typst.fonts]"
# IBM Plex Mono and Rajdhani ship with the theme; Sarasa Gothic SC with the
# cjk module.
[typst.fonts]
paths = []
modules = ["nasapunk", "cjk"]
system = true

# tola help "[assets]"
# Post images ("/assets/images/..."), the blog's stylesheet and the giscus
# loader. The theme's own files are published by the module.
[assets]
cache-busting = true
trees = [{ source = "assets", url-prefix = "/assets" }]
files = []

# tola help "[server]"
[server]
interface = "0.0.0.0"  # Accept LAN connections; "127.0.0.1" for this machine only
port = 5277

# tola help "[dev]"
[dev]
watch = true

# tola help "[vendor]"
[vendor]
path = "vendor"
