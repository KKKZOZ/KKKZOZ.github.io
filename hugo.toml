title = "KKKZOZ's Blog"
# copyright = "© [PaperMod Contributors](https://github.com/adityatelange/hugo-PaperMod/graphs/contributors)"
baseURL = 'http://blog.kkkzoz.top/'
pagination.pagerSize = 8
theme = ["hugo-admonitions", "PaperMod"]
enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true
enableGitInfo = true
mainsections = ["posts", "papermod"]
comments = true

[[module.mounts]]
source = 'static'
target = 'static'

[[module.mounts]]
source = 'images'
target = 'static/images'

[minify]
disableXML = true

[languages.en]
languageName = "English"
weight = 1

[languages.en.taxonomies]
category = "categories"
tag = "tags"
series = "series"

[[languages.en.menu.main]]
name = "Archive"
url = "archives"
weight = 5

[[languages.en.menu.main]]
name = "Search"
url = "search/"
weight = 10

[[languages.en.menu.main]]
name = "Tags"
url = "tags/"
weight = 10

[[languages.en.menu.main]]
name = "About"
url = "about/"
weight = 12

# [[languages.en.menu.main]]
# name = "WiKi"
# url = "https://github.com/adityatelange/hugo-PaperMod/wiki/"

[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
env = "production"
description = "KKKZOZ's Blog"
author = "KKKZOZ"
defaultTheme = "auto"
ShowShareButtons = true
ShowReadingTime = true
displayFullLangName = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowAllPagesInArchive = true
ShowPageNums = true
ShowToc = true
comments = true
math = true
images = ["images/papermod-cover.png"]

[params.profileMode]
enabled = false
title = "PaperMod"
imageUrl = "#"
imageTitle = "my image"

[[params.profileMode.buttons]]
name = "Archives"
url = "archives"

[[params.profileMode.buttons]]
name = "Tags"
url = "tags"

[params.homeInfoParams]
Title = "KKKZOZ's Blog"
Content = """
Three paper indexes(LLM/Transactions/Distributed Systems) are pinned.

Other posts are sorted by date.
"""

[[params.socialIcons]]
name = "github"
title = "View Source on Github"
url = "https://github.com/KKKZOZ/KKKZOZ.github.io"

# [[params.socialIcons]]
# name = "Discord"
# title = "Join discord community"
# url = "https://discord.gg/ahpmTvhVmp"

# [[params.socialIcons]]
# name = "X"
# title = "Share PaperMod on X/Twitter"
# url = "https://x.com/intent/tweet/?text=Checkout%20Hugo%20PaperMod%20%E2%9C%A8%0AA%20fast,%20clean,%20responsive%20Hugo%20theme.&url=https://github.com/adityatelange/hugo-PaperMod&hashtags=Hugo,PaperMod"


# [params.editPost]
# URL = "https://github.com/adityatelange/hugo-PaperMod/tree/exampleSite/content"
# Text = "Suggest Changes"
# appendFilePath = true

[params.assets]
disableHLJS = true

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = "monokai"

[services.instagram]
disableInlineCSS = true

[services.x]
disableInlineCSS = true
