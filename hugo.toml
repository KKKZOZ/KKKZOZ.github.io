baseURL = 'http://blog.kkkzoz.top/'
languageCode = 'en-us'
title = 'KKKZOZ-Blog'
theme = "archie"
paginate = 10
summaryLength = 10

# Code Highlight
# pygmentsstyle = "catppuccin-latte"
# # pygmentsstyle = "colorful"
# pygmentscodefences = true
# pygmentscodefencesguesssyntax = true

[markup.goldmark.renderer]
unsafe = true # Allow HTML in md files

[markup]
[markup.tableOfContents]
startLevel = 1
endLevel = 3

[markup.highlight]
anchorLineNos = false
codeFences = true
guessSyntax = false
lineAnchors = ''
lineNoStart = 1
lineNos = true
lineNumbersInTable = false
noClasses = true
noHl = false
style = 'monokai'
tabWidth = 4


[params]
mode = "toggle"          # color-mode → light,dark,toggle or auto
useCDN = false           # don't use CDNs for fonts and icons, instead serve them locally.
customcss = ["main.css"] # custom css files to be included
subtitle = ""
mathjax = true           # enable MathJax support
katex = true             # enable KaTeX support
tableOfContents = true


[[params.social]]
name = "GitHub"
icon = "github"
url = "https://github.com/kkkzoz"


[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "All posts"
url = "/posts"
weight = 2

[[menu.main]]
name = "Tags"
url = "/tags"
weight = 3

[[menu.main]]
name = "About"
url = "/about"
weight = 4
